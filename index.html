  <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App Puasa Ramadan</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}

.container{
  max-width:460px;
  margin:auto;
  padding:20px;
}

h1{margin-bottom:5px;}

.progressBox{
  background:#1e293b;
  border-radius:12px;
  padding:10px;
  margin:15px 0;
}

.bar{
  height:16px;
  background:#334155;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:0.4s;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:20px;
}

.day{
  padding:16px 0;
  background:#1e293b;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
}

.day.today{
  outline:2px solid #38bdf8;
}

.day.done{
  background:#22c55e;
  color:black;
}

button{
  margin-top:20px;
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background:#38bdf8;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🌙 Ramadan Tracker</h1>
<div id="info"></div>

<div class="progressBox">
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="percent">0% selesai</div>
</div>

<div class="grid" id="grid"></div>

<button onclick="resetAll()">Reset Semua</button>

</div>

<script>

<script>
// register service worker
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js");
}

const grid=document.getElementById("grid");
const fill=document.getElementById("fill");
const percent=document.getElementById("percent");

// 🔥 SET TANGGAL MULAI RAMADAN DI SINI
// format: tahun, bulan-1, tanggal
// contoh: Ramadan mulai 1 Maret 2026 → (2026,2,1)
const ramadanStart = new Date(2026,2,1);

function getPuasaDay(){
  const today=new Date();
  const diff=Math.floor((today-ramadanStart)/(1000*60*60*24))+1;
  if(diff>=1 && diff<=30) return diff;
  return null;
}

function render(){

grid.innerHTML="";
let done=0;
let todayPuasa=getPuasaDay();

for(let i=1;i<=30;i++){
 let d=document.createElement("div");
 d.className="day";
 d.textContent=i;

 // sorot hari puasa sekarang
 if(i===todayPuasa){
   d.style.outline="3px solid #38bdf8";
   d.style.transform="scale(1.05)";
 }

 if(localStorage.getItem("puasa_"+i)==="true"){
   d.classList.add("done");
   done++;
 }

 d.onclick=()=>{
   d.classList.toggle("done");
   localStorage.setItem("puasa_"+i,d.classList.contains("done"));
   render();
 };

 grid.appendChild(d);
}

let p=Math.round(done/30*100);
fill.style.width=p+"%";
percent.textContent="Progress: "+p+"% ("+done+"/30 hari)";
}

function resetAll(){
if(confirm("Reset semua?")){
for(let i=1;i<=30;i++) localStorage.removeItem("puasa_"+i);
render();
}
}

render();
</script>

</script>

</body>
</html>
    
  </body>
  
</html>
