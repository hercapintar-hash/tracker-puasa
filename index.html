  <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App Puasa Ramadan</title>

<style>
body{
  margin:0;
  font-family:system-ui, Arial;
  background:linear-gradient(180deg,#0b1220,#0f172a);
  color:white;
  text-align:center;
}

.container{
  max-width:460px;
  margin:auto;
  padding:22px;
}

h1{
  font-weight:600;
  letter-spacing:.5px;
}

.bar{
  height:18px;
  background:#1e293b;
  border-radius:999px;
  overflow:hidden;
  margin:18px 0 8px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.4);
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  transition:.45s ease;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:22px;
}

.day{
  padding:18px 0;
  background:linear-gradient(145deg,#1e293b,#172033);
  border-radius:18px;
  font-weight:600;
  font-size:18px;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}

.day:hover{
  transform:translateY(-2px);
}

.day.done{
  background:linear-gradient(145deg,#22c55e,#4ade80);
  color:#052e16;
  box-shadow:
    0 0 0 2px rgba(255,255,255,.2),
    0 0 18px rgba(34,197,94,.7),
    0 10px 18px rgba(0,0,0,.4);
  transform:scale(1.05);
}

button{
  margin-top:26px;
  padding:14px 20px;
  border:none;
  border-radius:16px;
  background:linear-gradient(90deg,#38bdf8,#0ea5e9);
  color:#001018;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(14,165,233,.35);
}

.toast{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#16a34a;
  color:white;
  padding:14px 22px;
  border-radius:14px;
  opacity:0;
  transition:.4s;
  font-weight:600;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="container">

<h1>🌙 Ramadan Tracker</h1>
<div id="info"></div>

<div class="progressBox">
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="percent">0% selesai</div>
</div>

<div class="grid" id="grid"></div>

<button onclick="resetAll()">Reset Semua</button>

</div>

 <script>
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js");
}

const grid=document.getElementById("grid");
const fill=document.getElementById("fill");
const percent=document.getElementById("percent");

function render(){

 grid.innerHTML="";
 let done=0;

 for(let i=1;i<=30;i++){

   let d=document.createElement("div");
   d.className="day";
   d.textContent=i;

   // cek storage
   if(localStorage.getItem("puasa_"+i)==="true"){
     d.classList.add("done");
     done++;
   }

   // klik toggle
   d.onclick=()=>{
     d.classList.toggle("done");
     localStorage.setItem("puasa_"+i,d.classList.contains("done"));
     render();
   };

   grid.appendChild(d);
 }

 let p=Math.round(done/30*100);
 fill.style.width=p+"%";
 percent.textContent=p+"% selesai ("+done+"/30 hari)";
}

function resetAll(){
 if(confirm("Reset semua?")){
   for(let i=1;i<=30;i++) localStorage.removeItem("puasa_"+i);
   render();
 }
}

render();
</script>
</body>
</html>
    
  </body>
  
</html>
